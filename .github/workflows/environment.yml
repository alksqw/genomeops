name: Environment Check

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: environment-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-environment:
    name: Verify development tools
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Show initial environment
        run: |
          uname -a
          git --version
          python --version
          java -version
          docker --version

      - name: Install Nextflow
        run: bash scripts/install_nextflow.sh

      - name: Install nf-test
        run: bash scripts/install_nf_test.sh

      - name: Install nf-core tools
        run: bash scripts/install_nf_core.sh

      - name: Verify complete environment
        run: bash scripts/verify_environment.sh
