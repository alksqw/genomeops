name: Pipeline Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pipeline-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run QC and alignment pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Nextflow
        run: bash scripts/install_nextflow.sh

      - name: Verify synthetic inputs
        run: |
          test -f tests/data/fastq/HG002_L001_R1.fastq
          test -f tests/data/fastq/HG002_L001_R2.fastq
          test -f tests/data/fastq/HG002_L002_R1.fastq
          test -f tests/data/fastq/HG002_L002_R2.fastq

          test -f \
            tests/data/reference/test_reference.fa

          grep -Fxq \
            ">chrTest" \
            tests/data/reference/test_reference.fa

          echo "[OK] Synthetic inputs are available."

      - name: Verify containers
        run: |
          docker version

          docker pull \
            quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0

          docker run --rm \
            quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0 \
            fastqc --version

          docker pull \
            multiqc/multiqc:v1.35

          docker run --rm \
            multiqc/multiqc:v1.35 \
            multiqc --version

          docker pull \
            quay.io/biocontainers/bwa-mem2:2.3--he70b90d_0

          docker run --rm \
            quay.io/biocontainers/bwa-mem2:2.3--he70b90d_0 \
            bwa-mem2 version
                    docker pull \
            quay.io/biocontainers/samtools:1.24--h9dcdb79_1

          docker run --rm \
            quay.io/biocontainers/samtools:1.24--h9dcdb79_1 \
            samtools --version

      - name: Run GenomeOps pipeline
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          nextflow run main.nf \
            --input assets/samplesheet.example.csv \
            --reference \
              tests/data/reference/test_reference.fa \
            --outdir results \
            --check_files true \
            -profile docker \
            -ansi-log false

      - name: Verify samplesheet outputs
        run: |
          test -f \
            results/pipeline_info/validated_samplesheet.csv

          test -f \
            results/pipeline_info/samplesheet_summary.txt

          grep -Fxq \
            "Validated rows: 2" \
            results/pipeline_info/samplesheet_summary.txt

          echo "[OK] Samplesheet outputs are correct."

      - name: Verify FastQC reports
        run: |
          html_count="$(
            find results/fastqc \
              -type f \
              -name '*_fastqc.html' \
            | wc -l
          )"

          zip_count="$(
            find results/fastqc \
              -type f \
              -name '*_fastqc.zip' \
            | wc -l
          )"

          echo "FastQC HTML reports: ${html_count}"
          echo "FastQC ZIP archives: ${zip_count}"

          test "${html_count}" -eq 4
          test "${zip_count}" -eq 4

          echo "[OK] FastQC reports are correct."

      - name: Verify MultiQC report
        run: |
          test -f \
            results/multiqc/multiqc_report.html

          test -d \
            results/multiqc/multiqc_data

          test -f \
            results/multiqc/multiqc.version.txt

          grep -Fq \
            "MultiQC" \
            results/multiqc/multiqc_report.html

          echo "[OK] MultiQC report is correct."

      - name: Verify BWA-MEM2 reference index
        run: |
          test -f \
            results/reference/bwa-mem2/test_reference.fa

          test -f \
            results/reference/bwa-mem2/test_reference.fa.0123

          test -f \
            results/reference/bwa-mem2/test_reference.fa.bwt.2bit.64

          test -s \
            results/reference/bwa-mem2/bwa-mem2.index.version.txt

          echo "[OK] BWA-MEM2 reference index exists."

      - name: Verify BWA-MEM2 alignments
        run: |
          sam_count="$(
            find results/alignment \
              -type f \
              -name '*.sam' \
            | wc -l
          )"

          echo "SAM files: ${sam_count}"

          test "${sam_count}" -eq 2

          while IFS= read -r sam
          do
            echo "Checking ${sam}"

            grep -Fq \
              "SM:HG002" \
              "${sam}"

            records="$(
              grep -vc '^@' "${sam}"
            )"

            mapped="$(
              awk '
                $1 !~ /^@/ && $3 != "*" {
                  count += 1
                }

                END {
                  print count + 0
                }
              ' "${sam}"
            )"

            echo "Records: ${records}"
            echo "Mapped: ${mapped}"

            test "${records}" -ge 4
            test "${mapped}" -ge 4
          done < <(
            find results/alignment \
              -type f \
              -name '*.sam' \
            | sort
          )

          echo "[OK] BWA-MEM2 alignments are correct."

      - name: Verify sorted BAM outputs
        run: |
          samtools_image="$(
            printf '%s' \
              'quay.io/biocontainers/' \
              'samtools:1.24--h9dcdb79_1'
          )"

          bam_count="$(
            find results/alignment \
              -type f \
              -name '*.sorted.bam' \
            | wc -l
          )"

          bai_count="$(
            find results/alignment \
              -type f \
              -name '*.sorted.bam.bai' \
            | wc -l
          )"

          echo "BAM files: ${bam_count}"
          echo "BAI files: ${bai_count}"

          test "${bam_count}" -eq 2
          test "${bai_count}" -eq 2

          while IFS= read -r bam
          do
            echo "Checking ${bam}"

            test -f "${bam}.bai"

            stem="${bam%.sorted.bam}"

            test -s "${stem}.flagstat.txt"
            test -s "${stem}.idxstats.txt"
            test -s "${stem}.stats.txt"

            grep -Fxq \
              "OK" \
              "${stem}.quickcheck.txt"

            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${samtools_image}" \
              samtools quickcheck \
                -v \
                "${bam}"

            records="$(
              docker run --rm \
                -u "$(id -u):$(id -g)" \
                -v "$GITHUB_WORKSPACE:/workspace" \
                -w /workspace \
                "${samtools_image}" \
                samtools view \
                  -c \
                  "${bam}"
            )"

            mapped="$(
              docker run --rm \
                -u "$(id -u):$(id -g)" \
                -v "$GITHUB_WORKSPACE:/workspace" \
                -w /workspace \
                "${samtools_image}" \
                samtools view \
                  -c \
                  -F 4 \
                  "${bam}"
            )"

            echo "Records: ${records}"
            echo "Mapped: ${mapped}"

            test "${records}" -ge 4
            test "${mapped}" -ge 4

            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${samtools_image}" \
              samtools view \
                -H \
                "${bam}" \
            | grep -Fq \
                "SO:coordinate"

          done < <(
            find results/alignment \
              -type f \
              -name '*.sorted.bam' \
            | sort
          )

          echo "[OK] Sorted and indexed BAM files are valid."


      - name: Verify markdup and CRAM outputs
        run: |
          final_dir="results/alignment/HG002/final"

          test -f \
            "${final_dir}/HG002.markdup.bam"

          test -f \
            "${final_dir}/HG002.markdup.bam.bai"

          test -f \
            "${final_dir}/HG002.markdup.cram"

          test -f \
            "${final_dir}/HG002.markdup.cram.crai"

          test -s \
            "${final_dir}/HG002.markdup.flagstat.txt"

          test -s \
            "${final_dir}/HG002.markdup.stats.txt"

          grep -Fxq \
            "Status: OK" \
            "${final_dir}/HG002.format-check.txt"

          metrics_file="$(
            find results/alignment/HG002/libraries \
              -type f \
              -name '*.markdup.metrics.txt' \
            | head -n 1
          )"

          test -n "${metrics_file}"

          grep -Fq \
            "DUPLICATE TOTAL" \
            "${metrics_file}"

          samtools_image="$(
            printf '%s' \
              'quay.io/biocontainers/' \
              'samtools:1.24--h9dcdb79_1'
          )"

          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "${samtools_image}" \
            samtools quickcheck \
              -v \
              "${final_dir}/HG002.markdup.bam" \
              "${final_dir}/HG002.markdup.cram"

          bam_records="$(
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${samtools_image}" \
              samtools view \
                -c \
                "${final_dir}/HG002.markdup.bam"
          )"

          cram_records="$(
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$GITHUB_WORKSPACE:/workspace" \
              -w /workspace \
              "${samtools_image}" \
              samtools view \
                -T tests/data/reference/test_reference.fa \
                -c \
                "${final_dir}/HG002.markdup.cram"
          )"

          echo "BAM records: ${bam_records}"
          echo "CRAM records: ${cram_records}"

          test "${bam_records}" -eq "${cram_records}"

          echo "[OK] Markdup BAM and CRAM are valid."
      - name: Show generated files
        run: |
          find results \
            -maxdepth 6 \
            -type f \
            -print \
          | sort

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: genomeops-markdup-cram-output
          path: |
            results/pipeline_info/
            results/fastqc/
            results/multiqc/
            results/reference/
            results/alignment/
            .nextflow.log
          if-no-files-found: error
          retention-days: 7