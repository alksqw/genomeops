name: Pipeline Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pipeline-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run samplesheet validation pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Nextflow
        run: bash scripts/install_nextflow.sh

      - name: Run samplesheet validation pipeline
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          nextflow run main.nf \
            --input assets/samplesheet.example.csv \
            --outdir results \
            -ansi-log false

      - name: Verify validated samplesheet
        run: |
          test -f \
            results/pipeline_info/validated_samplesheet.csv

          grep -Fq \
            "read_group" \
            results/pipeline_info/validated_samplesheet.csv

          grep -Fq \
            "HG002" \
            results/pipeline_info/validated_samplesheet.csv

          echo "Validated samplesheet:"
          cat results/pipeline_info/validated_samplesheet.csv

      - name: Verify samplesheet summary
        run: |
          test -f \
            results/pipeline_info/samplesheet_summary.txt

          grep -Fxq \
            "Validated rows: 2" \
            results/pipeline_info/samplesheet_summary.txt

          echo "Samplesheet summary:"
          cat results/pipeline_info/samplesheet_summary.txt

          echo
          echo "[OK] Samplesheet pipeline completed successfully."

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: genomeops-samplesheet-pipeline-output
          path: |
            results/pipeline_info/
            .nextflow.log
          if-no-files-found: error
          retention-days: 7