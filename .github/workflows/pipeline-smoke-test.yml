name: Pipeline Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pipeline-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run FastQC and MultiQC pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Nextflow
        run: bash scripts/install_nextflow.sh

      - name: Verify synthetic FASTQ inputs
        run: |
          test -f tests/data/fastq/HG002_L001_R1.fastq
          test -f tests/data/fastq/HG002_L001_R2.fastq
          test -f tests/data/fastq/HG002_L002_R1.fastq
          test -f tests/data/fastq/HG002_L002_R2.fastq

          echo "[OK] Synthetic FASTQ files are available."

      - name: Verify containers
        run: |
          docker version

          docker pull \
            quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0

          docker run --rm \
            quay.io/biocontainers/fastqc:0.12.1--hdfd78af_0 \
            fastqc --version

          docker pull \
            multiqc/multiqc:v1.35

          docker run --rm \
            multiqc/multiqc:v1.35 \
            multiqc --version

      - name: Run quality-control pipeline
        run: |
          export PATH="$HOME/.local/bin:$PATH"

          nextflow run main.nf \
            --input assets/samplesheet.example.csv \
            --outdir results \
            --check_files true \
            -profile docker \
            -ansi-log false

      - name: Verify samplesheet outputs
        run: |
          test -f \
            results/pipeline_info/validated_samplesheet.csv

          test -f \
            results/pipeline_info/samplesheet_summary.txt

          grep -Fxq \
            "Validated rows: 2" \
            results/pipeline_info/samplesheet_summary.txt

          echo "[OK] Samplesheet outputs are correct."

      - name: Verify FastQC reports
        run: |
          html_count="$(
            find results/fastqc \
              -type f \
              -name '*_fastqc.html' \
            | wc -l
          )"

          zip_count="$(
            find results/fastqc \
              -type f \
              -name '*_fastqc.zip' \
            | wc -l
          )"

          echo "FastQC HTML reports: ${html_count}"
          echo "FastQC ZIP archives: ${zip_count}"

          test "${html_count}" -eq 4
          test "${zip_count}" -eq 4

          echo "[OK] Four FastQC reports were created."

      - name: Verify MultiQC report
        run: |
          test -f \
            results/multiqc/multiqc_report.html

          test -d \
            results/multiqc/multiqc_data

          test -f \
            results/multiqc/multiqc.version.txt

          grep -Fq \
            "MultiQC" \
            results/multiqc/multiqc_report.html

          grep -Fq \
            "1.35" \
            results/multiqc/multiqc.version.txt

          for sample in \
            HG002_L001_R1 \
            HG002_L001_R2 \
            HG002_L002_R1 \
            HG002_L002_R2
          do
            grep -R -Fq \
              "${sample}" \
              results/multiqc
          done

          echo "[OK] MultiQC contains all four FASTQ inputs."

      - name: Show generated files
        run: |
          find results \
            -maxdepth 5 \
            -type f \
            -print \
          | sort

      - name: Upload quality-control outputs
        uses: actions/upload-artifact@v4
        with:
          name: genomeops-multiqc-output
          path: |
            results/pipeline_info/
            results/fastqc/
            results/multiqc/
            .nextflow.log
          if-no-files-found: error
          retention-days: 7