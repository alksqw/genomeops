name: Pipeline Smoke Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pipeline-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke-test:
    name: Run minimal Nextflow pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        run: bash scripts/install_nextflow.sh

      - name: Run minimal pipeline
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nextflow run main.nf -ansi-log false

      - name: Verify pipeline output
        run: |
          test -f results/hello.txt
          grep -Fxq "GenomeOps pipeline works" results/hello.txt

          echo "Generated output:"
          cat results/hello.txt

          echo
          echo "[OK] Minimal GenomeOps pipeline completed successfully."

      - name: Upload pipeline output
        uses: actions/upload-artifact@v4
        with:
          name: genomeops-smoke-test-output
          path: results/
          if-no-files-found: error
          retention-days: 7
